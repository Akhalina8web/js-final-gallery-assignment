<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Neighborhood Walk</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body onload="addTabFocus()">
  <a href="#main" class="offpage">Skip to Main Content</a>
<header class="home-header">
    <nav>
      <h1>Lake Louise and Banff</h1>
       <div id="image">
  Hover over an image below to display here.
</div>
    </nav>
  </header>
  <main id="main">

    <div class="grid">
      <img class = "preview"  src="images/Nature01.jpg" alt="Mountain valley viewed from a high scenic lookout." onmouseover = "upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)"
onblur="unDo()">
      <img src="images/Nature02.jpg"
        alt="Two people relaxing at a mountain viewpoint." onmouseover = "upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)"
onblur="unDo()">
      <img class = "preview"  src="images/Nature03.jpg" alt="Forest and mountains under a bright blue sky." onmouseover = "upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)"
onblur="unDo()">
      <img class = "preview"  src="images/Nature04.jpg" alt="Mountain river surrounded by evergreen trees." onmouseover = "upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)"
onblur="unDo()">
      <img class = "preview"  src="images/Nature05.jpg" alt="Mountain landscape with forest and scenic viewpoints during a summer hike." onmouseover = "upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)"
onblur="unDo()">
      <img class = "preview" src="images/Downtown01.jpg" alt="Evening views of the city with city lights, river, and walking paths." onmouseover = "upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)"
onblur="unDo()">

    </div>
<div id="lightbox" class="lightbox">

    <span class="close">&times;</span>

    <div class="lightbox-content">

        <img id="lightbox-img"
     src="images/Nature01.jpg"
     alt="Selected gallery image">

        <button id="prev" class="lightbox-arrow">&#10094;</button>
        <button id="next" class="lightbox-arrow">&#10095;</button>

    </div>

</div>
  </main>

</body>

</html>
